
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: 'rgb(var(--color-primary) / <alpha-value>)',
                light: 'rgb(var(--color-primary) / 0.7)',
                dark: 'rgb(var(--color-primary) / 1)',
              },
              background: {
                light: 'rgb(var(--color-bg-light) / <alpha-value>)',
                dark: 'rgb(var(--color-bg-dark) / <alpha-value>)',
              },
              surface: {
                light: 'rgb(var(--color-surface-light) / <alpha-value>)',
                dark: 'rgb(var(--color-surface-dark) / <alpha-value>)',
              },
              text: {
                primary: '#1A1D21',
                secondary: '#6C757D',
                darkPrimary: '#E8EAED',
                darkSecondary: '#9BA1A6',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Default Theme (Academic Blue) - Fallback */
        --color-primary: 74 95 122;
        --color-bg-light: 248 249 250;
        --color-bg-dark: 26 29 35;
        --color-surface-light: 255 255 255;
        --color-surface-dark: 34 38 46;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: rgb(var(--color-bg-light));
        color: #1A1D21;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .dark body {
        background-color: rgb(var(--color-bg-dark));
        color: #E8EAED;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #374151;
      }

      /* Editor Content Styles */
      .editor-content h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-top: 1em;
        margin-bottom: 0.5em;
        color: rgb(var(--color-primary));
      }
      .dark .editor-content h3 {
        color: rgb(var(--color-primary));
        opacity: 0.9;
      }
      .editor-content ul {
        list-style-type: disc;
        padding-left: 1.5em;
        margin-bottom: 1em;
      }
      .editor-content ol {
        list-style-type: decimal;
        padding-left: 1.5em;
        margin-bottom: 1em;
      }
      .editor-content li {
        margin-bottom: 0.25em;
      }
      .editor-content blockquote {
        border-left: 4px solid #cbd5e1;
        padding-left: 1em;
        font-style: italic;
        color: #64748b;
        margin-bottom: 1em;
      }
      .dark .editor-content blockquote {
        border-color: #475569;
        color: #94a3b8;
      }
      .editor-content b, .editor-content strong {
        font-weight: 600;
      }
      .editor-content i, .editor-content em {
        font-style: italic;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "date-fns": "https://esm.sh/date-fns@^4.1.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "date-fns/": "https://esm.sh/date-fns@^4.1.0/",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "vitest": "https://esm.sh/vitest@^4.0.16",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
